name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Keep this name stable: main protection requires this exact check.
    name: macOS tests
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      # Live provider tests are a separate, explicitly enabled release gate.
      SMART_CLIPBOARD_OMLX_TEST_URL: ""
      SMART_CLIPBOARD_OMLX_TEST_MODEL: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Prepare native tracing toolchain
        run: |
          command -v uv >/dev/null || brew install uv
          if ! command -v rustup >/dev/null; then
            brew install rustup
            RUSTUP_BIN="$(brew --prefix rustup)/bin"
            echo "$RUSTUP_BIN" >> "$GITHUB_PATH"
            export PATH="$RUSTUP_BIN:$PATH"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.94.0 --profile minimal

      - name: Build and test native tracer
        run: |
          TRACE_HELPER="$(bash scripts/build-tracer.sh)"
          echo "SMART_CLIPBOARD_TRACE_HELPER=$TRACE_HELPER" >> "$GITHUB_ENV"
          CARGO_TARGET_DIR="$PWD/.build/tracer" cargo +1.94.0 test --locked --manifest-path native/SmartClipboardTrace/Cargo.toml
          uv run --no-project python native/SmartClipboardTrace/test_cli.py --binary "$TRACE_HELPER"

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh Tests/ReleaseScripts/*.sh; do
            bash -n "$script"
          done

      - name: Test release orchestration
        run: bash Tests/ReleaseScripts/test-release.sh

      - name: Test publication guards
        run: uv run --no-project python Tests/ReleaseScripts/test-release-update.py

      - name: Test packaged bundle comparison
        run: uv run --no-project python Tests/ReleaseScripts/test-compare-bundles.py

      - name: Test app and core
        run: bash scripts/test.sh

      - name: Check interface translations
        run: |
          uv run --no-project python Tests/ReleaseScripts/test-localizations.py
          uv run --no-project python scripts/check-localizations.py
